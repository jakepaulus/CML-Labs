lab:
  description: Uses EPVN L3VNI to transport TrustSec tags across and unfriendly provider
    network. We also showcase basic tenant routed multicast.
  notes: |-
    # <a>Table of Contents</a>
    * [Scenario](#Scenario)
    * [EVPN](#EVPN)
    * [Let's Add TrustSec](#TrustSec)
    * [And now for Multicast](#Multicast)
    <br>

    # <a id="Scenario">Scenario</a>
    There is a layer-2 service provider link giving us connectivity between sw1 and sw2. This layer-2 transport does not support TrustSec tagging (CMD header). GRE tunnels are always an answer, but we have multiple VRFs. To save on the number of tunnels, we'll use VXLAN EVPN instead.

    The topology has basic OSPF routing configured for the default VRF between sw1 and sw2 as well as red and green VRFs.

    # <a id="EVPN">EVPN</a>
    [Reference configuration guide](https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9500/software/release/17-18/configuration_guide/vxlan/b_1718_bgp_evpn_vxlan_9500_cg/configuring_evpn_vxlan_layer_3_overlay_network.html)
    <br>

    ### Notes on configuration options to avoid
    ```
    vrf definition [name]
     vnid [VNI] evpn-instance vni auto core-vlan [VLAN ID]
    ```
    [(Reference)](https://www.cisco.com/c/en/us/support/docs/switches/catalyst-9300-series-switches/220804-use-vnid-to-auto-provision-l3vni-core-s.html) <br>
    Automatically creates: <ul><li>route target import and export policy in the VRF<li>VLAN 1000<li>VNI membership for VLAN 1000 to VNI 10000<li>IP unnumbered SVI for VLAN 1000 with no autostate<li>Associates VNI to the NVE interface</ul>
    This is awesome for fabrics where multicast isn't needed, but isn't a good fit in our case. We need to be able to add pim sparse-mode to our core VLAN SVI, and this macro won't let us do that.
    <br>

    ### Before you begin
    Please allow the Catalyst 9000v sufficient boot time. After the system appears ready, it may still need an additional 1-3 minutes before the emulated ASIC is operational, interfaces are up, and traffic can be forwarded. Validate you can ping from 192.168.12.1 to 192.168.12.2 before proceeding with remaining configuration.

    ## Data Plane Bring-up
    ### Configure
    On both sw1 and sw2:
    ```
    vlan configuration 1000
     member vni 10000
    vlan configuration 1001
     member vni 10001
    !
    interface Vlan1000
     vrf forwarding green
     ip unnumbered Loopback0
     no autostate
    !
    interface Vlan1001
     vrf forwarding red
     ip unnumbered Loopback0
     no autostate
    !
    interface nve1
     no ip address
     source-interface Loopback0
     host-reachability protocol bgp
     member vni 10000 vrf green
     member vni 10001 vrf red
    ```
    <br>

    ### Verify
    There's not too much to see at this point, but you may take a look at the following on both sw1 and sw2:
    ```
    show vrf detail green
    show vrf detail red
    show nve vni 10000 detail ! note the presence of VLAN and SVI MAC
    show nve vni 10001 detail ! note the presence of VLAN and SVI MAC
    ```
    <br>

    ## Control Plane Bring-up
    We need BGP to exchange EVPN routes for IP Prefixes as well as MAC addresses. VXLAN is a layer-2 tunneling mechanism, so traffic over the tunnel will need a destination MAC address even in the absence of L2VNIs.

    ### Configure
    On sw1:
    ```
    router bgp 65000
     bgp router-id interface Loopback0
     no bgp default ipv4-unicast
     neighbor 192.168.255.2 remote-as 65000
     neighbor 192.168.255.2 update-source Loopback0
     !
     address-family l2vpn evpn
      neighbor 192.168.255.2 activate
      neighbor 192.168.255.2 send-community extended
     exit-address-family
    !
    l2vpn evpn
     router-id Loopback0
    !
    vrf rd-auto
    vrf definition green
      address-family ipv4
       route-target export 65000:10000
       route-target import 65000:10000
       route-target export 65000:10000 stitching
       route-target import 65000:10000 stitching
     vrf definition red
      address-family ipv4
       route-target export 65000:10001
       route-target import 65000:10001
       route-target export 65000:10001 stitching
       route-target import 65000:10001 stitching
    ```

    On sw2:
    ```
    router bgp 65000
     bgp router-id interface Loopback0
     no bgp default ipv4-unicast
     neighbor 192.168.255.1 remote-as 65000
     neighbor 192.168.255.1 update-source Loopback0
     !
     address-family l2vpn evpn
      neighbor 192.168.255.1 activate
      neighbor 192.168.255.1 send-community extended
     exit-address-family
    !
    l2vpn evpn
     router-id Loopback0
    !
    vrf rd-auto
    vrf definition green
      address-family ipv4
       route-target export 65000:10000
       route-target import 65000:10000
       route-target export 65000:10000 stitching
       route-target import 65000:10000 stitching
     vrf definition red
      address-family ipv4
       route-target export 65000:10001
       route-target import 65000:10001
       route-target export 65000:10001 stitching
       route-target import 65000:10001 stitching
    ```

    Next, let's redistribute between BGP and OSPF to enable end-to-end reachability from r1 to r2.
    On sw1 and sw2:
    ```
    router bgp 65000
     address-family ipv4 vrf green
      advertise l2vpn evpn
      redistribute ospf 10
     exit-address-family
     !
     address-family ipv4 vrf red
      advertise l2vpn evpn
      redistribute ospf 11
     exit-address-family
    !
    router ospf 10 vrf green
      capability vrf-lite
      redistribute bgp 65000 metric 1000 tag 65000
    router ospf 11 vrf red
      capability vrf-lite
      redistribute bgp 65000 metric 1000 tag 65000
    ```
    <br>

    ### Verify
    You should have a few prefixes learnt via BGP on both sw1 and sw2:
    ``` show bgp l2vpn evpn summary ```

    You should be able to ping from end to end:<br>
    ```r1# ping vrf green 10.255.10.2 source lo10```<br>
    ```r1# ping vrf red 172.31.11.2 source lo11```

    On sw1, you should have output similar to below. Take your time to try understand this output, but the most important thing to know for L3VNI: The next-hop mac is 5254.00B1.2FDE -- this matches ```sw2# show nve vni 10000 detail``` or ```sw2# show int vlan 1000 | inc bia```

    The "core vlan" concept is strange at first, but VXLAN is layer-2, and we simply need a next-hop MAC address. Routers participating in VXLAN EVPN would use a bridge-domain interface for the same purpose.

    ```
    sw1#show bgp l2vpn evpn 10.255.10.2/32
    BGP routing table entry for [5][192.168.255.2:5][0][32][10.255.10.2]/17, version 20
    Paths: (1 available, best #1, table EVPN-BGP-Table)
      Flag: 0x100
      Not advertised to any peer
      Refresh Epoch 1
      Local
        192.168.255.2 (metric 2) (via default) from 192.168.255.2 (192.168.255.2)
          Origin incomplete, metric 2, localpref 100, valid, internal, best
          EVPN ESI: 00000000000000000000, Gateway Address: 0.0.0.0, VNI Label 10000, MPLS VPN Label 0
          Extended Community: RT:65000:10000 OSPF DOMAIN ID:0x0005:0x0000000A0200
            ENCAP:8 Router MAC:5254.00B1.2FDE OSPF RT:0.0.0.0:2:0
            OSPF ROUTER ID:10.0.12.1:0
          rx pathid: 0, tx pathid: 0x0
    ```
    <br>

    ## <a id="TrustSec">Let's Add TrustSec</a>
    Let's pretend r1 connects to a service which doesn't support TrustSec tagging natively, e.g., business partner VPN, an ACI fabric, etc. We'll use static IP-SGT bindings here, but would likely learn these bindings from ISE via SXP in a production environment.

    In the configuration below, ```group-based-policy``` under ```interface nve``` is what causes the switch to copy the SGT from the CMD header into the GPO attribute of the VXLAN header.

    ### Configure
    On r1:
    ```
    interface GigabitEthernet1.10
     cts manual
     policy static sgt 2 trusted
    interface GigabitEthernet1.11
     cts manual
     policy static sgt 2 trusted
    !
    cts role-based sgt-map vrf green 10.0.100.2 sgt 10
    ```

    On sw1 and sw2:
    ```
    interface GigabitEthernet1/0/1
     cts manual
     policy static sgt 2 trusted
    interface nve1
     group-based-policy
    ```

    On r2:
    ```
    interface GigabitEthernet1.12
     cts manual
     policy static sgt 2 trusted
    interface GigabitEthernet1.13
     cts manual
     policy static sgt 2 trusted
    ```
    <br>

    ### Verify
    On r1: ```show cts role-based sgt-map all```<br>
    On all devices: ```show cts interface brief```

    View the SGT values in the CMD on Ethernet links and the Group Policy ID value in the VXLAN header on the link between sw1 and sw2 in a packet capture.

    ## <a id="Multicast">And now for Multicast</a>
    Aside from removing the complexity of end-to-end VRF lite that GRE tunnels would have created in this scenario, efficient multicast is another reason VXLAN EVPN shines for this situation. Here we can choose between ingress/head-end replication or leverage multicast support in the underlay using Tenant Routed Multiast [(TRM)](https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9500/software/release/17-18/configuration_guide/vxlan/b_1718_bgp_evpn_vxlan_9500_cg/configuring_tenant_routed_multicast.html).

    In summary, BGP's MVPN address family is used to stitch together isolated PIM domains. RP placement is fully flexible if needed. We'll stick to SSM for our example.

    [Reference Configuration Guide](https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9500/software/release/17-18/configuration_guide/vxlan/b_1718_bgp_evpn_vxlan_9500_cg/configuring_tenant_routed_multicast.html)

    ### Configure
    On r1:
    ```
    ip multicast-routing vrf green distributed
    !
    interface GigabitEthernet1.10
     ip pim sparse-mode
    interface GigabitEthernet2
     ip pim sparse-mode
    interface Loopback10
     ip pim sparse-mode
    ip pim vrf green rp-add 10.255.10.10
    ```

    On sw1:
    ```
    ip multicast-routing
    ip multicast-routing vrf green
    !
    interface vlan10
     ip pim sparse-mode
    interface vlan1000
     ip pim sparse-mode
    interface GigabitEthernet1/0/2
     ip pim sparse-mode
    interface loopback0
     ip pim sparse-mode
    !
    interface Loopback10
     description anycast RP
     vrf forwarding green
     ip address 10.255.10.10 255.255.255.255
     ip pim sparse-mode
     ip ospf 10 area 0
    !
    vrf definition green
     address-family ipv4
      mdt auto-discovery vxlan
      mdt default vxlan 232.1.1.1
      mdt overlay use-bgp spt-only
      exit-address-family
    !
    ip pim rp-address 192.168.255.1
    ip pim vrf green rp-address 10.255.10.10
    !
    router bgp 65000
    address-family ipv4 mvpn
      neighbor 192.168.255.2 activate
      neighbor 192.168.255.2 send-community both
    ```

    On sw2:
    ```
    ip multicast-routing
    ip multicast-routing vrf green
    !
    interface vlan12
     ip pim sparse-mode
    interface vlan1000
     ip pim sparse-mode
    interface GigabitEthernet1/0/2
     ip pim sparse-mode
    interface loopback0
     ip pim sparse-mode
    !
    interface Loopback10
     description anycast RP
     vrf forwarding green
     ip address 10.255.10.10 255.255.255.255
     ip pim sparse-mode
     ip ospf 10 area 0
    !
    vrf definition green
     address-family ipv4
      mdt auto-discovery vxlan
      mdt default vxlan 232.1.1.1
      mdt overlay use-bgp spt-only
      exit-address-family
    !
    ip pim rp-address 192.168.255.1
    ip pim vrf green rp-address 10.255.10.10
    !
    router bgp 65000
    address-family ipv4 mvpn
      neighbor 192.168.255.1 activate
      neighbor 192.168.255.1 send-community both
    ```


    On r2:
    ```
    ip multicast-routing vrf green distributed
    !
    interface GigabitEthernet1.12
     ip pim sparse-mode
    interface Loopback10
     ip pim sparse-mode
    ip pim vrf green rp-add 10.255.10.10
    ```
    <br>

    ### Verify

    On r2:
    ```
    interface Loopback10
    ip igmp join-group 239.1.1.1
    ```

    On r1: ``` ping vrf green 239.1.1.1 repeat 10```

    On any device:
    ``` show ip mroute vrf green 239.1.1.1```

    On sw1 and sw2:
    ```show bgp ipv4 mvpn vrf green detail```
